name: 'Solana Security Standard'
description: 'Scan Solana/Anchor Rust code against the Solana Security Standard (SOL-0XX) — by Jelleo.'
author: 'Jelleo'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  paths:
    description: 'Files or directories to scan (space-separated). Do NOT wire this from untrusted PR data.'
    required: false
    default: '.'
  fail-on-findings:
    description: 'Fail the check (red X) when findings are present.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload results to GitHub code scanning for inline PR annotations (needs `security-events: write`).'
    required: false
    default: 'true'
  patterns:
    description: 'Path to a custom rules.json (default: the bundled SOL-0XX rules).'
    required: false
    default: ''
  min-tier:
    description: >-
      Report only findings at/above this value tier: "high" drops LOW-tier
      hygiene/operational noise — concretely, SOL-003/018/022/023/030 disappear
      from both the annotations and the gate; "low" (or empty, the default)
      reports everything. A noise floor, NOT a verdict — not for audit-grade
      scans. Invalid values fail the run (the scanner exits 2), never silently
      scan with no floor. Safe to set statically; like all inputs, do not wire
      it from untrusted PR data.
    required: false
    default: ''
  baseline:
    description: >-
      Path to a committed baseline file (create with `npx
      @jelleo/solana-security-standard scan . --write-baseline <file>`): only
      findings NOT in it are reported and gated, so CI alerts on what a change
      introduces. Suppressed/stale counts are always surfaced; a malformed or
      missing baseline fails the run (exit 2), never silently scans without it.
      The baseline lives in the scanned checkout — review baseline diffs in PRs
      like code (every entry must carry its rule/file snapshot; a minimized
      entry is rejected at load).
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Produce SARIF first, never failing here, so the upload step always has a file.
    - name: Scan → SARIF
      shell: bash
      env:
        # Inputs are passed via env (NOT interpolated into the script body) so a
        # caller who wires an input from untrusted PR data can't inject shell.
        SSS_PATHS: ${{ inputs.paths }}
        SSS_PATTERNS: ${{ inputs.patterns }}
        SSS_MIN_TIER: ${{ inputs.min-tier }}
        SSS_BASELINE: ${{ inputs.baseline }}
        SSS_BIN: ${{ github.action_path }}/cli/bin.js
        SSS_SARIF: ${{ runner.temp }}/solana-security-standard.sarif
      run: |
        set -f  # no shell globbing of path args; the scanner walks dirs itself
        # Flags first, then a `--` sentinel: anything word-split out of $SSS_PATHS
        # is treated as a PATH, never a flag — so untrusted input can't inject
        # --patterns / --no-fail / -o. --root keeps SARIF paths repo-root-relative.
        # $SSS_MIN_TIER and $SSS_BASELINE are each passed quoted as ONE argument;
        # the scanner validates both (exit 2 on a bad tier or a malformed/missing
        # baseline) so a bad value fails loud, never quiet.
        args=(scan --format sarif --output "$SSS_SARIF" --root "$GITHUB_WORKSPACE" --no-fail)
        if [ -n "$SSS_PATTERNS" ]; then args+=(--patterns "$SSS_PATTERNS"); fi
        if [ -n "$SSS_MIN_TIER" ]; then args+=(--min-tier "$SSS_MIN_TIER"); fi
        if [ -n "$SSS_BASELINE" ]; then args+=(--baseline "$SSS_BASELINE"); fi
        args+=(-- $SSS_PATHS)
        node "$SSS_BIN" "${args[@]}"

    # Inline PR annotations + the Security tab. Best-effort: a missing
    # security-events permission must not break the check itself.
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      continue-on-error: true
      # SHA-pinned (supply-chain): a hijacked floating tag can't swap the code that
      # reads our SARIF + repo token. Dependabot bumps the pin via the version comment.
      uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
      with:
        sarif_file: ${{ runner.temp }}/solana-security-standard.sarif
        category: solana-security-standard

    # Human-readable summary in the log, and the gate that sets the check status.
    - name: Report & gate
      shell: bash
      env:
        SSS_PATHS: ${{ inputs.paths }}
        SSS_PATTERNS: ${{ inputs.patterns }}
        SSS_MIN_TIER: ${{ inputs.min-tier }}
        SSS_BASELINE: ${{ inputs.baseline }}
        SSS_BIN: ${{ github.action_path }}/cli/bin.js
        SSS_NOFAIL: ${{ inputs.fail-on-findings == 'false' && '1' || '' }}
      run: |
        set -f
        args=(scan --no-color --root "$GITHUB_WORKSPACE")
        if [ -n "$SSS_PATTERNS" ]; then args+=(--patterns "$SSS_PATTERNS"); fi
        if [ -n "$SSS_MIN_TIER" ]; then args+=(--min-tier "$SSS_MIN_TIER"); fi
        if [ -n "$SSS_BASELINE" ]; then args+=(--baseline "$SSS_BASELINE"); fi
        if [ -n "$SSS_NOFAIL" ]; then args+=(--no-fail); fi
        args+=(-- $SSS_PATHS)
        node "$SSS_BIN" "${args[@]}"
