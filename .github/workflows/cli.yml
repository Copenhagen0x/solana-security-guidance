name: cli

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'security-patterns.yaml'
      - 'rules-meta.json'
      - 'semgrep/**'
      - 'integrations/**'
      - 'claude-security-guidance.md'
      - 'plugin-guidance.md'
      - 'extensions/**'
      - 'mcp/**'
      - 'hacks/**'
      - 'content/**'
      - 'examples/**'
      - 'disclosures/**'
      - 'action.yml'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'security-patterns.yaml'
      - 'rules-meta.json'
      - 'semgrep/**'
      - 'integrations/**'
      - 'claude-security-guidance.md'
      - 'plugin-guidance.md'
      - 'extensions/**'
      - 'mcp/**'
      - 'hacks/**'
      - 'content/**'
      - 'examples/**'
      - 'disclosures/**'
      - 'action.yml'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  test:
    name: scanner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - run: npm ci
      - name: rules.json is in sync with security-patterns.yaml
        run: node scripts/sync-rules.js --check
      - name: semgrep ruleset is in sync with security-patterns.yaml
        run: node scripts/sync-semgrep.js --check
      - name: AI-tool integrations are in sync with the guidance
        run: node scripts/sync-integrations.js --check
      - name: BENCHMARK.md is in sync with examples + rules
        run: node scripts/sync-benchmark.js --check
      - name: unit tests
        run: node --test
      - name: smoke — self-scan the vulnerable examples (report only)
        run: node bin.js scan ../examples --no-fail

  action-selftest:
    name: composite action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # The action itself, run from the local tree (uses: ./) against the vulnerable
      # examples — the only place the composite's bash plumbing is exercised in CI.
      # upload-sarif is off everywhere: no security-events permission, no upload.
      - name: report-only scan finds the examples
        uses: ./
        with:
          paths: examples
          fail-on-findings: 'false'
          upload-sarif: 'false'
      - name: min-tier passthrough (high floor, report-only)
        uses: ./
        with:
          paths: examples
          fail-on-findings: 'false'
          upload-sarif: 'false'
          min-tier: high
      # Baseline end-to-end: record the examples' findings with the SAME root the
      # action uses (fingerprints embed the reported path), then a baselined run
      # with the gate ON must stay green — zero NEW findings. CWD is
      # $GITHUB_WORKSPACE for both this run step and the composite's run steps,
      # which is why the relative paths — and so the fingerprints — match.
      - name: write a baseline with the CLI (same root as the action)
        shell: bash
        run: node cli/bin.js scan examples -r "$GITHUB_WORKSPACE" --write-baseline "$RUNNER_TEMP/sss-baseline.json" --no-fail -q
      - name: baselined run gates green (fail-on-findings stays true)
        uses: ./
        with:
          paths: examples
          upload-sarif: 'false'
          baseline: ${{ runner.temp }}/sss-baseline.json
      # Fail-closed negative: an invalid min-tier must FAIL the action (scanner
      # exit 2) — proves a bad input can never silently scan without its floor.
      - name: bogus min-tier (expected to fail)
        id: bogus
        continue-on-error: true
        uses: ./
        with:
          paths: examples
          upload-sarif: 'false'
          min-tier: bogus
      - name: assert the bogus run failed
        shell: bash
        run: |
          if [ "${{ steps.bogus.outcome }}" != "failure" ]; then
            echo "::error::invalid min-tier did not fail the action (outcome: ${{ steps.bogus.outcome }})"
            exit 1
          fi

  semgrep:
    name: semgrep ruleset (validate in RE2)
    runs-on: ubuntu-latest
    container:
      # Pinned: `latest` + `--strict` would turn a future Semgrep behaviour change
      # into spurious CI red. Bump deliberately.
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: ruleset compiles in Semgrep's RE2 engine
        # --validate exits non-zero on any unloadable rule (e.g. a regex RE2 rejects
        # as "too large"); --strict treats rule-level warnings as errors too.
        run: semgrep --validate --config semgrep/solana-security-standard.yaml --strict --metrics off
      - name: rules fire on the vulnerable examples (sanity, report-only)
        run: semgrep scan --config semgrep/solana-security-standard.yaml --metrics off --no-git-ignore examples || true

  extension:
    name: vscode extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: extensions/vscode
        shell: bash   # the && chain below must behave the same on the Windows runner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # The extension vendors the reviewed scanner core from ../../cli at build time
      # (engine/ is gitignored), then runs its pure diagnostics tests. No deps to install.
      - name: vendor the scanner engine + run tests
        run: node scripts/sync-engine.js && node --test

  mcp:
    name: mcp server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # Vendors the reviewed scanner core + guidance from ../cli + the repo root, then
      # runs the protocol + tool + stdio end-to-end tests. No deps to install.
      - name: vendor the engine + run tests
        run: node scripts/sync-engine.js && node --test

  hacks:
    name: hacks database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hacks
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # hacks.json is the source of truth; README.md is generated. Validate the data
      # (schema + every SOL-0XX id exists in the guidance) and that README is in sync.
      - name: validate hacks.json + README is in sync
        run: node scripts/sync-hacks.js --check
      - name: unit tests
        run: node --test

  content:
    name: rule content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # Per-rule pages are generated from the guidance + patterns + hacks + examples.
      # Validate they are in sync (no stale page, no orphan), then run the unit tests.
      - name: content pages are in sync
        run: node scripts/sync-content.js --check
      - name: unit tests
        run: node --test

  disclosures:
    name: disclosure feed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disclosures
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      # Adapters + the SOL-0XX classifier + ingest, validated against the catalogued exploits
      # (classifier recall) and the Hacks-DB validator (candidate structural readiness). No network.
      - name: unit tests
        run: node --test
