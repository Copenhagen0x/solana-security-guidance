# Solana Security Patterns — by Jelleo
# https://github.com/Copenhagen0x/solana-security-standard
# Audits + bounty wins: https://jelleo.com
#
# Deterministic per-edit patterns drawn from real-world Solana bounty findings.
# Companion to .claude/claude-security-guidance.md (semantic rules for the
# model-backed reviews).
#
# Each `reminder` is what your IDE shows when the pattern fires. Reminders
# start with "Jelleo SOL-NNN:" so the rule provenance is visible.

patterns:
  - rule_name: sol_001_unauth_now_slot
    regex: "fn\\s+\\w+(?:<[^>]{0,120}>)?\\([^)]{0,500}now_slot\\s*:\\s*u64"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/test/**"]
    reminder: "Jelleo SOL-001: handler accepts `now_slot` from instruction data. Authenticate against Clock::get()?.slot before use — caller-controlled clocks enable permanent DoS of permissionless cranks. Two confirmed-exploitable bounty wins in this class: percolator-prog#107 (ACTIVATE, fixed 6512fa1) + percolator-cli#78 F33 (RETIRE, fixed 3fd9b1d). See: github.com/Copenhagen0x/solana-security-standard#sol-001."

  - rule_name: sol_002_cross_market_counter
    regex: "pnl_pos_bound_tot|cross_market_counter|insurance_fund_total|shared_pool_total"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-002: cross-market aggregate counter. Verify EVERY write to this field is gated by per-market authorization — permissionless cross-market inflation enables insurance-fund drain. Documented public class (percolator-prog#104); not a Jelleo bounty win — included because the pattern is reproducible across perp-DEX programs. See: github.com/Copenhagen0x/solana-security-standard#sol-002."

  - rule_name: sol_005_realloc_no_guard
    substrings: [".realloc("]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-005: AccountInfo.realloc() called. Verify (1) account owner == program_id, (2) new size is bounded, (3) rent-exemption maintained after resize. Latent pattern documented in our bounty 5 disclosure (percolator-cli#78 F12) — reachable when the per-program asset cap is lifted. See: github.com/Copenhagen0x/solana-security-standard#sol-005."

  - rule_name: sol_006_raw_account_info
    regex: "\\bAccountInfo\\s*<"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-006: raw `AccountInfo` (no Signer<>/Account<> type). If this account is a privileged CALLER, verify `account.is_signer == true` before mutating state, or use Anchor's `Signer<>`. (A documented `/// CHECK:` account used only as a CPI target / program ID / read-only ref is fine — this is a heuristic flag.) See: github.com/Copenhagen0x/solana-security-standard#sol-006."

  - rule_name: sol_007_raw_data_borrow
    regex: "&\\*[\\w.]{1,200}\\.data\\.borrow\\(\\)"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-007: raw `&*account.data.borrow()` access. Verify `account.owner == program_id` BEFORE deserializing — attacker can pass a same-length account from a different program whose layout matches. See: github.com/Copenhagen0x/solana-security-standard#sol-007."

  - rule_name: sol_009_invoke_signed
    regex: "invoke_signed\\s*\\("
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-009: `invoke_signed` CPI. Verify the CALLER has authority for this operation BEFORE the CPI — `invoke_signed` just signs with a PDA, it doesn't validate upstream authority. See: github.com/Copenhagen0x/solana-security-standard#sol-009."

  - rule_name: sol_010_init_if_needed
    substrings: ["init_if_needed", ".data.borrow_mut()", "try_borrow_mut_data"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-010: reinitialization / account takeover — matched on the PROPERTY, not one idiom. Fires on Anchor `init_if_needed` AND on a hand-rolled reinit: a raw account-header write via `.data.borrow_mut()` / `try_borrow_mut_data()`. If a permissionless handler (re)writes an account WITHOUT first proving it is FRESH (8-byte discriminator all-zero, `is_initialized == false`, or `#[account(zero)]`), a second call re-inits a LIVE account: the caller-chosen authority/owner overwrites the stored one, and a downstream `has_one = authority` instruction (withdraw/close) then trusts the attacker -> takeover -> drain. `owner == program_id` proves ownership, NOT freshness. SAFE form: read `data[0..8] != [0;8]` and reject an already-initialized account (Orca `initialize_dynamic_tick_array`), or plain `init` / `#[account(zero)]` + an existence guard checked before any payout. Real incident: Metaplex Candy Machine v1 config-drain. See: github.com/Copenhagen0x/solana-security-standard#sol-010."

  - rule_name: sol_011_close_attr
    regex: "#\\[account\\((?:[^)(]|\\((?:[^)(]|\\([^)(]{0,100}\\)){0,150}\\)){0,300}close\\s*="
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-011: `#[account(close = ...)]`. Verify (1) account is fully drained before close, (2) lamports go to a controlled destination, (3) any token accounts are closed via Token program, not just zeroed. See: github.com/Copenhagen0x/solana-security-standard#sol-011."

  - rule_name: sol_013_hardcoded_token_program
    substrings: ["TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"]
    paths: ["**/*.rs"]
    reminder: "Jelleo SOL-013: hardcoded SPL Token program ID. Use `anchor_spl::token::ID` (or `anchor_spl::token_2022::ID` for Token-2022 accounts) so the typed account ensures the right program is invoked. See: github.com/Copenhagen0x/solana-security-standard#sol-013."

  - rule_name: sol_014_unchecked_arithmetic
    regex: "(?:u64|i64|u128|i128)\\s*=\\s*\\w+\\s*[-+*]\\s*\\w+\\s*[;,)]"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-014: integer +/-/* without checked_*. Release builds wrap silently — overflow OR subtraction underflow (the classic lamport drain) — and the wrap is the financial bug. Use `a.checked_add(b)` / `checked_sub(b).ok_or(ErrorCode::Overflow)?`. Heuristic flag — already-checked code can ignore. See: github.com/Copenhagen0x/solana-security-standard#sol-014."

  - rule_name: sol_016_bump_field_read
    regex: "\\.bump\\s*[;,)}\\]]"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/state*.rs", "**/state/**"]
    reminder: "Jelleo SOL-016: a stored `.bump` is read. Risk: a non-canonical bump — reused via an Anchor `bump = <account>.bump` constraint, or read and fed to `create_program_address` (both accept non-canonical bumps → PDA substitution). SAFE only if the SAME account's bump was set at init via Anchor's bare `bump`/`ctx.bumps` (canonical), NOT a caller-supplied `#[instruction(bump)]` value — verify that init, then dismiss; otherwise it's the bug. For non-constraint reads compare to `find_program_address(seeds, &program_id).1`. See: github.com/Copenhagen0x/solana-security-standard#sol-016."

  - rule_name: sol_017_unsafe_transmute
    substrings: ["unsafe { transmute", "unsafe{transmute", "mem::transmute(", "mem::transmute::"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-017: `unsafe transmute` on account data. Use bytemuck/anchor typed deserialize with explicit length + discriminator checks. transmute skips both. See: github.com/Copenhagen0x/solana-security-standard#sol-017."

  - rule_name: sol_018_hardcoded_system_program
    substrings: ["\"11111111111111111111111111111111\""]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-018: hardcoded System Program ID literal (32 ones in quotes — the canonical empty pubkey). Use `solana_program::system_program::ID` so the comparison is type-safe and a future renaming/typo doesn't silently break verification. See: github.com/Copenhagen0x/solana-security-standard#sol-018."

  - rule_name: sol_019_try_deserialize_unchecked
    substrings: ["try_deserialize_unchecked"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-019: `try_deserialize_unchecked` skips the 8-byte discriminator check. An attacker can pass a different account type with matching length. Use `try_deserialize` (with discriminator check) unless you've already verified the discriminator manually. See: github.com/Copenhagen0x/solana-security-standard#sol-019."

  - rule_name: sol_020_set_authority
    regex: "\\b(SetAuthority\\b|set_authority\\s*\\()"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**"]
    reminder: "Jelleo SOL-020: SetAuthority CPI. Verify the CURRENT authority matches the expected key BEFORE invoking — without this check, an attacker can hijack ownership of any token account that flows through this handler. See: github.com/Copenhagen0x/solana-security-standard#sol-020."

  - rule_name: sol_024_oracle_price_unchecked
    substrings: ["get_price_unchecked"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-024: `get_price_unchecked` reads a Pyth price with NO staleness or confidence check. Use `get_price_no_older_than(...)` and reject prices whose confidence interval is too wide — a stale or wide-confidence price lets an attacker trade/liquidate at a mispriced value. See: github.com/Copenhagen0x/solana-security-standard#sol-024."

  - rule_name: sol_025_sysvar_raw_deserialize
    substrings: ["bincode::deserialize::<Clock", "bincode::deserialize::<Rent"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-025: a sysvar (Clock/Rent) read by RAW-deserializing account data instead of `Clock::get()` or `Sysvar::from_account_info` (both of which key-check the account internally). The raw path trusts whatever account is passed, so an attacker supplies a look-alike carrying chosen time/rent values. Fix: use `Clock::get()` / Anchor `Sysvar<>`; never hand-deserialize a sysvar account. See: github.com/Copenhagen0x/solana-security-standard#sol-025."

  # Bounded cross-line span ([\s\S]{0,600}? — RE2-portable, no lookarounds): a CPI
  # call followed closely by an Anchor account-field read. Fail-open tripwire —
  # Anchor serves the deserialized copy from BEFORE the call, so a post-CPI read
  # without reload() can be stale. reload() does NOT silence the regex (RE2 has
  # no negative lookahead); the fix clears exclusion #1 instead.
  - rule_name: sol_033_stale_read_after_cpi
    regex: "\\b(?:invoke(?:_signed)?|token::(?:transfer|burn|mint_to|close_account))\\s*\\([\\s\\S]{0,600}?\\bctx\\.accounts\\.\\w+\\.(?:amount|owner|delegate|data\\b|lamports\\(\\))"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-033: an account field is read after a CPI in the same handler — the CPI can mutate that account (balance/authority/data), and Anchor serves the deserialized copy from BEFORE the call. Call `x.reload()` (or re-read from the AccountInfo) between the CPI and the read. Heuristic flag — fires on CPI-then-field-read proximity; cite exclusion #1 if the account is reload()ed, #2 if the callee provably can't touch it. See: github.com/Copenhagen0x/solana-security-standard#sol-033."

  - rule_name: sol_034_manual_lamport_mutation
    substrings: ["try_borrow_mut_lamports", "lamports.borrow_mut()"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-034: direct lamport mutation (`try_borrow_mut_lamports` / `lamports.borrow_mut()`). The runtime conserves the per-instruction lamport SUM, but your internal ledger does not move with it — verify every manual debit/credit updates the matching recorded balance (vault totals, user claims), the debited account stays rent-exempt, and the destination is validated. For system-owned accounts use a transfer CPI instead. See: github.com/Copenhagen0x/solana-security-standard#sol-034."

  - rule_name: sol_035_instructions_sysvar_substitution
    substrings: ["load_instruction_at_checked", "load_current_index_checked", "get_instruction_relative"]
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-035: instruction introspection (`load_instruction_at_checked` / `load_current_index_checked` / `get_instruction_relative`) to verify a precompile (Ed25519/Secp256k1) signature. TWO checks are required: (1) PIN the instructions sysvar account — Anchor `Sysvar<Instructions>` (pins the key) or assert `account.key() == sysvar::instructions::ID`; AND (2) VALIDATE the introspected precompile instruction's program id AND its parsed signer pubkey + signed message against the expected values. Checking only that 'an Ed25519/Secp256k1 instruction ran' is bypassable — an attacker includes a real precompile ix over their own keypair and message. See: github.com/Copenhagen0x/solana-security-standard#sol-035."

  # ── Integrator / client-side rules (SOL-029..031) ───────────────────────────
  # These target the TypeScript/JavaScript that BUILDS AND SENDS transactions
  # (bots, keepers, workers, integrators) — not on-chain Rust. The `languages`
  # field (absent => rust, the on-chain default) drives the Semgrep generator;
  # the scanner keys off `paths`. Sourced from a live integrator's bug report.
  - rule_name: sol_029_skip_preflight
    languages: [typescript, javascript]
    regex: "skipPreflight\\s*:\\s*true|\\.skipPreflight\\s*=\\s*true"
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/__tests__/**", "**/__mocks__/**", "**/mocks/**", "**/*.test.*", "**/*.spec.*", "**/node_modules/**", "**/dist/**", "**/build/**"]
    reminder: "Jelleo SOL-029: transaction sent with preflight simulation disabled (`skipPreflight: true`). A blind send eats reverts and fees and can desync a live bot/keeper. Either drop `skipPreflight`, or call `simulateTransaction()` and assert `err === null` (inspecting logs/compute units) BEFORE sending to mainnet. See: github.com/Copenhagen0x/solana-security-standard#sol-029."
  - rule_name: sol_030_static_priority_fee
    languages: [typescript, javascript]
    regex: "microLamports\\s*:\\s*(?:0[xX][0-9a-fA-F]+|[1-9][0-9_]*)"
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/__tests__/**", "**/__mocks__/**", "**/mocks/**", "**/*.test.*", "**/*.spec.*", "**/node_modules/**", "**/dist/**", "**/build/**"]
    reminder: "Jelleo SOL-030: hardcoded priority fee (`microLamports: <constant>`). A static compute-unit price underpays during congestion (the tx never lands) or overpays when the network is idle. Derive it from `getRecentPrioritizationFees()` (or a fee oracle) and clamp to a sane max. (`microLamports: 0` — the intentional no-priority-fee opt-out — does not fire.) See: github.com/Copenhagen0x/solana-security-standard#sol-030."
  - rule_name: sol_031_jupiter_quote_freshness
    languages: [typescript, javascript]
    substrings: ["api.jup.ag", "createJupiterApiClient"]
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/__tests__/**", "**/__mocks__/**", "**/mocks/**", "**/*.test.*", "**/*.spec.*", "**/node_modules/**", "**/dist/**", "**/build/**"]
    reminder: "Jelleo SOL-031: Jupiter quote consumed without a `contextSlot` freshness check. Quotes go stale within a few slots; executing an old route means a worse fill and MEV/sandwich exposure. Capture `quoteResponse.contextSlot` and refetch (or reject) if it lags the current slot before you swap. Heuristic flag — fires on Jupiter quote usage (any `api.jup.ag` host or the `@jup-ag/api` client); ignore if you already gate on `contextSlot`. See: github.com/Copenhagen0x/solana-security-standard#sol-031."

  - rule_name: sol_038_pda_seed_collision
    regex: "(?:\\bseeds\\s*=\\s*\\[|\\b(?:find|create)_program_address\\s*\\(\\s*&\\[)[^\\]]{0,160}?\\.as_bytes\\(\\)\\s*,\\s*&?\\s*[A-Za-z_][\\w.]{0,60}\\.as_bytes\\(\\)"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-038: two caller-controlled variable-length seeds (`x.as_bytes(), y.as_bytes()`) sit ADJACENT in `seeds = [...]` with no fixed-width separator. Seeds hash as one flat buffer, so the boundary is unpinned: `a|bX == ab|X` derives the SAME PDA for two DISTINCT accounts (alias/overwrite). Fix: pin every boundary - hash/length-prefix each variable element to a constant width, OR keep one variable element LAST, OR put a fixed-width element (Pubkey/`[u8; N]`) between two variables; AND lead same-namespace schemes with a per-type tag of a CONSISTENT width (all u32, never mixed) from one program-wide enum. Fires on two adjacent `.as_bytes()` seeds in the `seeds = [...]` macro and the native `find_program_address(&[...])` form; misses the cross-scheme and `.as_ref()`-on-slice forms (see exclusions). Distinct from SOL-008/016. See: github.com/Copenhagen0x/solana-security-standard#sol-038."

  - rule_name: sol_039_partial_cpi_state
    regex: "(?:\\blet\\s+_\\s*=\\s*(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\\s*\\(|(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\\s*\\([^;]{0,1200}?\\)\\s*\\.\\s*(?:ok|is_err|is_ok|unwrap_or|unwrap_or_default|unwrap_or_else)\\s*\\(|\\bif\\s+let\\s+(?:Ok|Err)\\s*\\([^)]*\\)\\s*=\\s*(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\\s*\\(|\\bmatch\\s+(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\\s*\\()"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-039: a fund-moving CPI's Result is SWALLOWED (`let _ = ...`, `.ok()`, a logged `.is_err()`/`.is_ok()`, `.unwrap_or*`, or a `match`/`if let Err =` arm that does not re-`?`). On Solana only an Err RETURNED from the top-level instruction reverts writes, so a caught inner-CPI failure leaves any account written BEFORE the call committed while the transfer never happened - an asymmetric half-applied state the attacker farms by forcing the CPI to fail. Propagate with `?` so the instruction reverts atomically; if you must catch it, ROLL BACK every prior self-mutation. The regex sees the discarded Result but not whether a self-mutation preceded it: dismiss via exclusion #4 (nothing committed first), #2 (`?`-propagated), #3 (`require!`-guarded `.is_ok()`), #5 (rollback). It DOES fire on `require!(cpi.is_ok())` and a `match` whose `Err` arm returns - both SAFE. Distinct from SOL-033. See: github.com/Copenhagen0x/solana-security-standard#sol-039."

  - rule_name: sol_042_compute_budget_dos
    regex: "\\bfor\\s+(?:\\w+|\\([^)]{0,80}\\))\\s+in\\b[^{;]{0,80}\\bremaining_accounts\\b"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-042: a loop iterates `remaining_accounts`, whose length the caller controls. With no per-instruction cap, an attacker pads it until the handler exceeds the ~1.4M CU limit and EVERY call reverts - a permanent DoS that freezes any crank behind it. Bound the trip count: `require!(ctx.remaining_accounts.len() <= MAX, ...)` (MAX proven to fit the CU budget), a fixed slice, or paginate with a stored cursor; also cap any persisted Vec the loop reads at its push site (even an admin-grown list bricks it). DO NOT stop at the count: if the loop pays accounts, bind each iterated account by identity to authoritative state (`require_keys_eq!` vs a stored registry/PDA) or it is a double-pay/skip fund-drain (SOL-027). Fires on `for <x> in ...remaining_accounts...` incl. `for (i, acc) in ...enumerate()`; misses `while i < len()` and `.iter().for_each/map/fold`. Distinct from SOL-027, SOL-014. See: github.com/Copenhagen0x/solana-security-standard#sol-042."

  - rule_name: sol_044_hardcoded_slot_time_rate
    regex: "\\bSLOTS_PER_(?:YEAR|DAY|HOUR|MINUTE|WEEK|MONTH|EPOCH|SECOND)\\b|\\b(?:MS_PER_SLOT|SLOT_DURATION_MS|SLOT_TIME_MS|MILLIS_PER_SLOT)\\b|\\bslots?\\b[^;\\n]{0,40}?[*/]\\s*400\\b"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-044: a hardcoded slot->time conversion (SLOTS_PER_YEAR/DAY/..., MS_PER_SLOT, or a slot delta `* / 400`) computes elapsed time. Solana slot time is NOT a fixed ~400ms - it drifts with load (historically slower) - so interest/emissions/vesting/funding accrued this way diverges from wall-clock (over/under-payment that compounds; an attacker farms the drift). Fix: accrue on `Clock::get()?.unix_timestamp` deltas (store `last_update_ts: i64`; use `now_ts - last_update_ts`), never a slots-per-period constant. If you clamp the delta, advance the cursor by only the charged amount (`last_update_ts += elapsed`) - a `.min(MAX)` then `last_update_ts = now` silently forgives time beyond MAX (deterministic interest evasion). Dismiss via exclusion #1 (logs/UI only), #2 (not a slot->time scale), #3 (per-slot by spec), #4 (conservative bound that can only REJECT). Distinct from SOL-001. See: github.com/Copenhagen0x/solana-security-standard#sol-044."

  - rule_name: sol_046_hand_rolled_dispatch
    regex: "match\\s+(?:instruction_data|_?ix_?data|data|input)\\s*(?:\\.\\s*(?:first|split_first|get)\\s*\\([^)]{0,40}\\)|\\[\\s*0\\s*\\])"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-046: a hand-rolled instruction dispatcher (`match instruction_data[0]` / split-first tag byte) routes by raw bytes instead of Anchor's `#[program]` macro. This BYPASSES the framework: no 8-byte discriminator check and NONE of the `#[account(...)]` constraints (has_one, seeds/bump, owner, signer, mut) run - they are only emitted for `#[derive(Accounts)]` handlers. The pattern flags the DISPATCHER; the bug lives in the ROUTED handler - if it takes a bare `&[AccountInfo]`, every account is unvalidated (wrong-type/owner, unsigned, PDA-substituted). Routing only to typed `Context<T>` handlers is safe. Fix: route through `#[program]` + `#[derive(Accounts)]`, OR (if native) re-validate EVERY account on EVERY arm - `try_deserialize` (discriminator), `owner == program_id`, canonical-vs-stored bump (SOL-016), `is_signer`. FP: also fires on `match <local>[0]` over validated program-owned data. See: github.com/Copenhagen0x/solana-security-standard#sol-046."

  - rule_name: sol_049_struct_padding_flag
    regex: "unsafe\\s+impl\\b[^;{\\n]{0,80}\\b(?:Pod|Zeroable)\\s+for\\b"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-049: a HAND-WRITTEN `unsafe impl Pod`/`Zeroable for ...` on account-data. The real `#[derive(Pod, Zeroable)]` rejects a `bool` or implicit padding at compile time; a hand impl silently asserts Pod, so a security-relevant byte (a bool flag or reserved padding) is read with NO canonicalization - a `bool` reads `true` for ANY non-zero byte, and if attacker-writable that opens an authority gate. Distinct from SOL-017, SOL-007. Fix (ALL required): drop the hand impl - use `#[account(zero_copy)]` + `AccountLoader::load()` or the REAL derive, over a layout with NO bool and NO implicit padding (named fields; reserved bytes zero-checked on load AND zeroed on write); store flags as `u8`, assert canonicality on EVERY load (`require!(flag <= 1)`, branch `== 1`); AND validate the OWNER + 8-byte discriminator (canonicalization alone is bypassable). Fires only on a single-line hand `unsafe impl ... for`; raw `bytemuck` casts are review-only. See: github.com/Copenhagen0x/solana-security-standard#sol-049."

  - rule_name: sol_051_predictable_onchain_entropy
    regex: "\\brecent_blockhashes\\b|\\bRecentBlockhashes\\b|\\bslot_hashes\\b|\\bSlotHashes\\b|\\bunix_timestamp\\b[\\s\\S]{0,80}?%|\\bslot\\b[\\s\\S]{0,40}?%[\\s\\S]{0,40}?\\blen\\b"
    paths: ["**/*.rs"]
    exclude_paths: ["**/tests/**", "**/test/**", "**/client/**", "**/cli/**", "**/offchain/**", "**/sdk/**"]
    reminder: "Jelleo SOL-051: an on-chain-observable value (Clock unix_timestamp/slot, RecentBlockhashes/SlotHashes sysvar) seeds a draw. HIGH-FP arms: `unix_timestamp %` and `slot % len` fire on legitimate time-bucketing/cooldown windows and round-robin indexing - DISMISS (exclusion #4) unless a payout/mint/rank decision READS the modulo result. Real bug: these values are NOT random - every node computes the same one, so the submitter simulates and only sends when they win (grind), and the slot leader can steer them. If it seeds a value-bearing outcome (lottery/raffle/airdrop) it is deterministically claimable -> drain; hashing/XOR-mixing does NOT help. Fix needs ALL: a VRF (Switchboard/ORAO) or commit-reveal; an OWNER check that the result account is the oracle program's (a program-local struct is forgeable); binding to THIS draw via a key stored at request time; the oracle reveal method that fails when unfulfilled; a commit-slot freshness check. See: github.com/Copenhagen0x/solana-security-standard#sol-051."
