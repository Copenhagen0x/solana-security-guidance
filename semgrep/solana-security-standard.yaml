# Solana Security Standard — Semgrep ruleset (SOL-0XX).
# GENERATED from ../security-patterns.yaml by cli/scripts/sync-semgrep.js — do not edit by hand.
# Regenerate: `npm --prefix cli run sync:semgrep`.
# Run:        `semgrep --config semgrep/solana-security-standard.yaml <path>`.
rules:
  - id: solana-security-standard.sol-001-unauth-now-slot
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-001: handler accepts `now_slot` from instruction data. Authenticate against Clock::get()?.slot before use — caller-controlled clocks enable permanent DoS of permissionless cranks. Two confirmed-exploitable bounty wins in this class: percolator-prog#107 (ACTIVATE, fixed 6512fa1) + percolator-cli#78 F33 (RETIRE, fixed 3fd9b1d). See: github.com/Copenhagen0x/solana-security-standard#sol-001.'
    patterns:
      - pattern-regex: fn\s+\w+(?:<[^>]{0,120}>)?\([^)]{0,500}now_slot\s*:\s*u64
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
    metadata:
      sol-id: SOL-001
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-001
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the caller-supplied slot/timestamp is authenticated against Clock::get()?.slot (e.g. clamped/rejected) before any use
        - the value is provably discarded — never written to an account, emitted in an event, or used in a later gate (a positive 'not persisted' proof, not merely 'this handler does not seem to use it')
        - the handler is gated to an admin that must SIGN AND is bound by an explicit constraint to a hardcoded / program-stored admin key (constraint = signer.key() == config.admin, or has_one = admin WHERE admin is declared Signer<>) — a bare Signer<> with no such binding is a user-supplied key the caller self-assigns and is NOT sufficient, nor is a key-equality/has_one check on a non-signer account — AND the value is never re-read by a permissionless crank or downstream instruction
  - id: solana-security-standard.sol-002-cross-market-counter
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-002: cross-market aggregate counter. Verify EVERY write to this field is gated by per-market authorization — permissionless cross-market inflation enables insurance-fund drain. Documented public class (percolator-prog#104); not a Jelleo bounty win — included because the pattern is reproducible across perp-DEX programs. See: github.com/Copenhagen0x/solana-security-standard#sol-002.'
    patterns:
      - pattern-regex: pnl_pos_bound_tot|cross_market_counter|insurance_fund_total|shared_pool_total
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-002
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-002
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - every write to the counter is gated by the market's authority proven via a SIGNATURE — a Signer<> on that authority, a PDA-signed CPI WHERE the signing PDA is derived from seeds sourced from the market account's own on-chain state (its key or a field loaded from it — NOT a caller-supplied market id from instruction data) that bind it to THIS specific market, or has_one/constraint WHERE the bound authority account is itself declared Signer<>; a has_one (or key-equality) on a NON-signing account only checks the key (not consent), and a global/unscoped authority PDA that can sign for ANY market, are NOT sufficient
        - the counter is strictly per-market (not a shared aggregate) and has no cross-market read path
  - id: solana-security-standard.sol-005-realloc-no-guard
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-005: AccountInfo.realloc() called. Verify (1) account owner == program_id, (2) new size is bounded, (3) rent-exemption maintained after resize. Latent pattern documented in our bounty 5 disclosure (percolator-cli#78 F12) — reachable when the per-program asset cap is lifted. See: github.com/Copenhagen0x/solana-security-standard#sol-005.'
    patterns:
      - pattern-regex: \.realloc\(
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-005
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-005
      license: MIT
      sss-tier: high
      sss-severity: medium
      sss-exclusions:
        - account.owner == program_id is checked before the realloc
        - the new size is bounded by a validated cap AND rent-exemption is re-funded after the resize
        - the account is newly allocated in THIS instruction AND its size is verified == 0 before the realloc (size==0 is mandatory, not optional; additionally any lamports were transferred by the program, not pre-funded by an attacker), so no attacker-supplied prior state or size can exist
  - id: solana-security-standard.sol-006-raw-account-info
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-006: raw `AccountInfo` (no Signer<>/Account<> type). If this account is a privileged CALLER, verify `account.is_signer == true` before mutating state, or use Anchor''s `Signer<>`. (A documented `/// CHECK:` account used only as a CPI target / program ID / read-only ref is fine — this is a heuristic flag.) See: github.com/Copenhagen0x/solana-security-standard#sol-006.'
    patterns:
      - pattern-regex: \bAccountInfo\s*<
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-006
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-006
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the AccountInfo is a documented `/// CHECK:` used only as a CPI target, program id, or read-only/sysvar ref — not a privileged caller whose signature matters
        - account.is_signer is asserted (or the field is a Signer<>/Account<>) before any state mutation
        - the account is never used to authorize a state change or fund movement — on-chain OR by an off-chain consumer of its emitted/logged key
  - id: solana-security-standard.sol-007-raw-data-borrow
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-007: raw `&*account.data.borrow()` access. Verify `account.owner == program_id` BEFORE deserializing — attacker can pass a same-length account from a different program whose layout matches. See: github.com/Copenhagen0x/solana-security-standard#sol-007.'
    patterns:
      - pattern-regex: '&\*[\w.]{1,200}\.data\.borrow\(\)'
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-007
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-007
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - account.owner == program_id (or the expected program) is checked before deserializing
        - the account is an Anchor `Account<'info, T>` (Anchor enforces the owner) rather than a raw AccountInfo
        - the bytes are read only for display/logging and are never persisted, emitted in an event, or trusted for any authorization or fund decision — on-chain OR by an off-chain consumer of the emitted data
  - id: solana-security-standard.sol-009-invoke-signed
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-009: `invoke_signed` CPI. Verify the CALLER has authority for this operation BEFORE the CPI — `invoke_signed` just signs with a PDA, it doesn''t validate upstream authority. See: github.com/Copenhagen0x/solana-security-standard#sol-009.'
    patterns:
      - pattern-regex: invoke_signed\s*\(
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-009
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-009
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the caller's authority for THIS SPECIFIC privileged operation is verified (Signer + has_one/constraint binding the caller to the target resource) BEFORE the invoke_signed — a 'trusted target program' or any unrelated upstream Signer check is NOT sufficient
  - id: solana-security-standard.sol-010-init-if-needed
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-010: reinitialization / account takeover — matched on the PROPERTY, not one idiom. Fires on Anchor `init_if_needed` AND on a hand-rolled reinit: a raw account-header write via `.data.borrow_mut()` / `try_borrow_mut_data()`. If a permissionless handler (re)writes an account WITHOUT first proving it is FRESH (8-byte discriminator all-zero, `is_initialized == false`, or `#[account(zero)]`), a second call re-inits a LIVE account: the caller-chosen authority/owner overwrites the stored one, and a downstream `has_one = authority` instruction (withdraw/close) then trusts the attacker -> takeover -> drain. `owner == program_id` proves ownership, NOT freshness. SAFE form: read `data[0..8] != [0;8]` and reject an already-initialized account (Orca `initialize_dynamic_tick_array`), or plain `init` / `#[account(zero)]` + an existence guard checked before any payout. Real incident: Metaplex Candy Machine v1 config-drain. See: github.com/Copenhagen0x/solana-security-standard#sol-010.'
    patterns:
      - pattern-regex: (?:init_if_needed|\.data\.borrow_mut\(\)|try_borrow_mut_data)
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-010
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-010
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the account holds no lamports, token balances, authority keys, OR access-gating state that a second initialization could reset — access-gating state includes (non-exhaustively) a timestamp / nonce / status used as a lock, AND any field that controls subsequent PDA derivation, account creation, or role assignment
        - an explicit already-initialized guard REJECTS a second initialization before any write — for a hand-rolled `.data.borrow_mut()`/`try_borrow_mut_data` write the 8-byte discriminator is asserted all-zero (`data[0..8] == [0;8]`) or an `is_initialized`/version flag asserted false and the handler returns Err when already set (Orca `initialize_dynamic_tick_array`), for Anchor it is plain `init` / `#[account(zero)]`; a bare `.data.borrow_mut()` that only writes a data region of an already-type-validated account (discriminator/authority untouched) also clears this
        - the value-moving path is gated by a nullifier/spent-marker created with plain `init` so a duplicate redemption ABORTS AT ACCOUNT CREATION before any payout - NOT a mutable boolean flag in an existing account (a flag a reset/reinit path can re-open does NOT clear this rule)
  - id: solana-security-standard.sol-011-close-attr
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-011: `#[account(close = ...)]`. Verify (1) account is fully drained before close, (2) lamports go to a controlled destination, (3) any token accounts are closed via Token program, not just zeroed. See: github.com/Copenhagen0x/solana-security-standard#sol-011.'
    patterns:
      - pattern-regex: '#\[account\([^;{}#]{0,400}?close\s*='
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-011
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-011
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the account is fully drained (lamports AND any token balances) before close and its data is zeroed, AND it holds no delegated authority over other on-chain resources (mints, PDAs, vaults) that must be explicitly revoked before close
        - the close destination is program-controlled or a signer-validated key, not an attacker-supplied account
      note: 'RE2-safe port: the scanner''s depth-2 paren-balanced regex is rejected by Semgrep as "too large" (RE2 expands the nested {0,N} repetitions). This delimiter-bounded window flags `close =` within a 400-char #[account( ... ) region. It stops the window at ; { } and # — none appear inside an attribute, and stopping at # means the NEAREST #[account( wins so the finding lands on the right attribute even when two are adjacent. It favors recall over the scanner''s exact paren-balancing; both flag the same real #[account(close = ...)] attributes incl. long multi-line ones. Known limit: a raw-string literal (r#"..."#) inside a constraint before close= would stop the window early — a theoretical Semgrep-only miss; the scanner still catches it.'
  - id: solana-security-standard.sol-013-hardcoded-token-program
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-013: hardcoded SPL Token program ID. Use `anchor_spl::token::ID` (or `anchor_spl::token_2022::ID` for Token-2022 accounts) so the typed account ensures the right program is invoked. See: github.com/Copenhagen0x/solana-security-standard#sol-013.'
    patterns:
      - pattern-regex: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    metadata:
      sol-id: SOL-013
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-013
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the typed anchor_spl::token::ID / token_2022::ID is used via a typed Program<> account, not a raw literal
        - 'the literal lives only in a test/const and is NEVER reached on any runtime branch for a program id used in a CPI — including behind a #[cfg(feature = ...)] / #[cfg(not(test))] block that ships in ANY production build (verify the call site AND the build''s enabled features, not just the declaration; only #[cfg(test)] truly excludes it)'
  - id: solana-security-standard.sol-014-unchecked-arithmetic
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-014: integer +/-/* without checked_*. Release builds wrap silently — overflow OR subtraction underflow (the classic lamport drain) — and the wrap is the financial bug. Use `a.checked_add(b)` / `checked_sub(b).ok_or(ErrorCode::Overflow)?`. Heuristic flag — already-checked code can ignore. See: github.com/Copenhagen0x/solana-security-standard#sol-014.'
    patterns:
      - pattern-regex: (?:u64|i64|u128|i128)\s*=\s*\w+\s*[-+*]\s*\w+\s*[;,)]
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-014
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-014
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the operation already uses checked_/try_/saturating_ math with explicit error handling for the financial case
        - both operands are compile-time-bounded constants that cannot overflow/underflow
        - the value is non-financial AND does not feed any downstream financial calculation (proven by tracing every use-site, not a 'this field looks non-financial' claim), AND the operands are bounded so the maximum possible result cannot exceed the type's max (proven by an explicit checked bound or a type-level guarantee, not an unverified 'validated range')
  - id: solana-security-standard.sol-016-bump-field-read
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-016: a stored `.bump` is read. Risk: a non-canonical bump — reused via an Anchor `bump = <account>.bump` constraint, or read and fed to `create_program_address` (both accept non-canonical bumps → PDA substitution). SAFE only if the SAME account''s bump was set at init via Anchor''s bare `bump`/`ctx.bumps` (canonical), NOT a caller-supplied `#[instruction(bump)]` value — verify that init, then dismiss; otherwise it''s the bug. For non-constraint reads compare to `find_program_address(seeds, &program_id).1`. See: github.com/Copenhagen0x/solana-security-standard#sol-016.'
    patterns:
      - pattern-regex: \.bump\s*[;,)}\]]
    paths:
      exclude:
        - '**/tests/**'
        - '**/state*.rs'
        - '**/state/**'
    metadata:
      sol-id: SOL-016
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-016
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - 'the read is `bump = <account>.bump` (or a bare `seeds = [...], bump` with NO `= target` after bump) on a typed `Account<''info, T>`, AND the SAME account''s stored bump was written at init by Anchor''s bare `bump` / `ctx.bumps.<name>` (canonical) — NOT a caller-supplied `#[instruction(bump)]` value and NOT a value from create_program_address: verify that exact init site, then dismiss (idiomatic canonical reuse, not a finding). If the init bump is caller-supplied or otherwise non-canonical, this reuse IS the bug — keep it (Anchor''s `bump = <expr>` re-derives via create_program_address with the GIVEN bump, so a non-canonical stored bump still validates).'
        - a non-constraint read is validated against the canonical bump before use (e.g. require!(stored == Pubkey::find_program_address(seeds, program_id).1))
        - the PDA (and its bump) is created in the same instruction using the canonical bump from find_program_address (NOT a caller-supplied bump passed to create_program_address, which accepts any valid off-curve bump and re-introduces the non-canonical-bump bug)
  - id: solana-security-standard.sol-017-unsafe-transmute
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-017: `unsafe transmute` on account data. Use bytemuck/anchor typed deserialize with explicit length + discriminator checks. transmute skips both. See: github.com/Copenhagen0x/solana-security-standard#sol-017.'
    patterns:
      - pattern-regex: (?:unsafe \{ transmute|unsafe\{transmute|mem::transmute\(|mem::transmute::)
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-017
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-017
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - a typed deserialize with length + discriminator validation precedes any field use
        - the cast is over a freshly-created, program-owned, length-checked buffer with a verified layout
  - id: solana-security-standard.sol-018-hardcoded-system-program
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-018: hardcoded System Program ID literal (32 ones in quotes — the canonical empty pubkey). Use `solana_program::system_program::ID` so the comparison is type-safe and a future renaming/typo doesn''t silently break verification. See: github.com/Copenhagen0x/solana-security-standard#sol-018.'
    patterns:
      - pattern-regex: '"11111111111111111111111111111111"'
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-018
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-018
      license: MIT
      sss-tier: low
      sss-severity: low
      sss-exclusions:
        - the program-id comparison uses the imported system_program::ID type-safely, not a raw string literal
        - 'the literal appears only in a #[cfg(test)] module or a const that is never reached on a runtime program-id verification — a #[cfg(feature = ...)] block that ships in a production build does NOT qualify'
  - id: solana-security-standard.sol-019-try-deserialize-unchecked
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-019: `try_deserialize_unchecked` skips the 8-byte discriminator check. An attacker can pass a different account type with matching length. Use `try_deserialize` (with discriminator check) unless you''ve already verified the discriminator manually. See: github.com/Copenhagen0x/solana-security-standard#sol-019.'
    patterns:
      - pattern-regex: try_deserialize_unchecked
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-019
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-019
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - try_deserialize (with the discriminator check) is used, or the 8-byte discriminator is verified manually before the unchecked deserialize
        - the SAME account being deserialized is declared as an Anchor `Account<'info, T>` field (which enforces the discriminator) — not merely that some other account in the same handler is Anchor-typed
  - id: solana-security-standard.sol-020-set-authority
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-020: SetAuthority CPI. Verify the CURRENT authority matches the expected key BEFORE invoking — without this check, an attacker can hijack ownership of any token account that flows through this handler. See: github.com/Copenhagen0x/solana-security-standard#sol-020.'
    patterns:
      - pattern-regex: \b(SetAuthority\b|set_authority\s*\()
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-020
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-020
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the current authority is verified to equal the expected key before the SetAuthority CPI
        - an Anchor `constraint = <signer>.key() == <resource>.authority` on a Signer<> (or has_one WHERE the bound authority field is itself declared Signer<>) binds the SIGNING caller to the CURRENT authority of the resource being changed — a bare Signer<> not bound to the stored authority key, OR a has_one/constraint on a NON-signing authority account (key matches but the holder never consents), is NOT sufficient
  - id: solana-security-standard.sol-024-oracle-price-unchecked
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-024: `get_price_unchecked` reads a Pyth price with NO staleness or confidence check. Use `get_price_no_older_than(...)` and reject prices whose confidence interval is too wide — a stale or wide-confidence price lets an attacker trade/liquidate at a mispriced value. See: github.com/Copenhagen0x/solana-security-standard#sol-024.'
    patterns:
      - pattern-regex: get_price_unchecked
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-024
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-024
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - get_price_no_older_than (staleness, with a max-age bound that reflects the protocol's real staleness tolerance — u64::MAX or an unreasonably large age is NOT sufficient) AND a confidence-interval bound are both enforced before use
        - the price feeds a non-economic / display-only path that cannot trigger a trade, liquidation, or any other economic action — neither on-chain NOR via an off-chain consumer (e.g. a keeper reading emitted price events to trigger liquidations, rebalancing, or collateral updates)
  - id: solana-security-standard.sol-025-sysvar-raw-deserialize
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-025: a sysvar (Clock/Rent) read by RAW-deserializing account data instead of `Clock::get()` or `Sysvar::from_account_info` (both of which key-check the account internally). The raw path trusts whatever account is passed, so an attacker supplies a look-alike carrying chosen time/rent values. Fix: use `Clock::get()` / Anchor `Sysvar<>`; never hand-deserialize a sysvar account. See: github.com/Copenhagen0x/solana-security-standard#sol-025.'
    patterns:
      - pattern-regex: (?:bincode::deserialize::<Clock|bincode::deserialize::<Rent)
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-025
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-025
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - Clock::get() / Rent::get() or an Anchor Sysvar<> is used (the account key is checked internally)
        - the sysvar account key is explicitly verified against the canonical sysvar id before the raw deserialize
  - id: solana-security-standard.sol-033-stale-read-after-cpi
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-033: an account field is read after a CPI in the same handler — the CPI can mutate that account (balance/authority/data), and Anchor serves the deserialized copy from BEFORE the call. Call `x.reload()` (or re-read from the AccountInfo) between the CPI and the read. Heuristic flag — fires on CPI-then-field-read proximity; cite exclusion #1 if the account is reload()ed, #2 if the callee provably can''t touch it. See: github.com/Copenhagen0x/solana-security-standard#sol-033.'
    patterns:
      - pattern-regex: \b(?:invoke(?:_signed)?|token::(?:transfer|burn|mint_to|close_account))\s*\([\s\S]{0,600}?\bctx\.accounts\.\w+\.(?:amount|owner|delegate|data\b|lamports\(\))
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-033
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-033
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the account is reload()ed (or re-deserialized from its AccountInfo) between the CPI and the read
        - the callee provably cannot mutate the read account — it is not in the CPI's account set and the callee cannot reach it via nested CPI (name the callee and its full account set; 'the callee looks unrelated' is NOT sufficient)
        - the read value feeds only logs/events, never a gate, an amount computation, or stored state
  - id: solana-security-standard.sol-034-manual-lamport-mutation
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-034: direct lamport mutation (`try_borrow_mut_lamports` / `lamports.borrow_mut()`). The runtime conserves the per-instruction lamport SUM, but your internal ledger does not move with it — verify every manual debit/credit updates the matching recorded balance (vault totals, user claims), the debited account stays rent-exempt, and the destination is validated. For system-owned accounts use a transfer CPI instead. See: github.com/Copenhagen0x/solana-security-standard#sol-034.'
    patterns:
      - pattern-regex: (?:try_borrow_mut_lamports|lamports\.borrow_mut\(\))
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-034
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-034
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the mutation updates BOTH the lamports and the matching internal balance/claim field in the same instruction (cite both writes), and the debited account remains rent-exempt afterwards
        - 'the mutation is the documented rent-refund path of an account close: the destination is validated against stored state (not caller-chosen), and the account''s data is zeroed or discarded in the same instruction'
        - the accounts are system-owned and the movement uses a system-program transfer CPI — a manual write on a system-owned account cannot deduct anyway (the runtime rejects it); flag it as dead/misleading code
  - id: solana-security-standard.sol-035-instructions-sysvar-substitution
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-035: instruction introspection (`load_instruction_at_checked` / `load_current_index_checked` / `get_instruction_relative`) to verify a precompile (Ed25519/Secp256k1) signature. TWO checks are required: (1) PIN the instructions sysvar account — Anchor `Sysvar<Instructions>` (pins the key) or assert `account.key() == sysvar::instructions::ID`; AND (2) VALIDATE the introspected precompile instruction''s program id AND its parsed signer pubkey + signed message against the expected values. Checking only that ''an Ed25519/Secp256k1 instruction ran'' is bypassable — an attacker includes a real precompile ix over their own keypair and message. See: github.com/Copenhagen0x/solana-security-standard#sol-035.'
    patterns:
      - pattern-regex: (?:load_instruction_at_checked|load_current_index_checked|get_instruction_relative)
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-035
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-035
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - 'BOTH: the account read is an Anchor `Sysvar<''info, Instructions>` (or `account.key() == solana_program::sysvar::instructions::ID` is asserted), AND the introspected precompile instruction''s program id, signer pubkey, AND signed message are all validated against the expected values before the result authorizes anything — pinning the sysvar alone is NOT sufficient (a real Ed25519/Secp256k1 ix over an attacker-chosen pubkey/message still passes a ''did a precompile run'' check)'
        - the introspection result is used only for logging/telemetry — never to authorize a state change, accept a precompile-verified signature, or gate a CPI-origin check (a positive 'not security-relevant' proof, not merely 'looks informational')
  - id: solana-security-standard.sol-029-skip-preflight
    languages:
      - typescript
      - javascript
    severity: WARNING
    message: 'Jelleo SOL-029: transaction sent with preflight simulation disabled (`skipPreflight: true`). A blind send eats reverts and fees and can desync a live bot/keeper. Either drop `skipPreflight`, or call `simulateTransaction()` and assert `err === null` (inspecting logs/compute units) BEFORE sending to mainnet. See: github.com/Copenhagen0x/solana-security-standard#sol-029.'
    patterns:
      - pattern-regex: skipPreflight\s*:\s*true|\.skipPreflight\s*=\s*true
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/mocks/**'
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/node_modules/**'
        - '**/dist/**'
        - '**/build/**'
    metadata:
      sol-id: SOL-029
      category: security
      confidence: LOW
      technology:
        - solana
        - typescript
        - javascript
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-029
      license: MIT
      sss-tier: high
      sss-severity: medium
      sss-exclusions:
        - preflight stays on, or simulateTransaction is called and err === null is asserted before the mainnet send
        - 'skipPreflight: true is on a devnet/test/throwaway path, not a value-moving mainnet send — AND the gate selecting it FAILS CLOSED (defaults to preflight ON for mainnet): an env check like `CLUSTER !== ''mainnet-beta''` that yields skipPreflight when the var is unset does NOT qualify; require an explicit non-mainnet allowlist'
  - id: solana-security-standard.sol-030-static-priority-fee
    languages:
      - typescript
      - javascript
    severity: WARNING
    message: 'Jelleo SOL-030: hardcoded priority fee (`microLamports: <constant>`). A static compute-unit price underpays during congestion (the tx never lands) or overpays when the network is idle. Derive it from `getRecentPrioritizationFees()` (or a fee oracle) and clamp to a sane max. (`microLamports: 0` — the intentional no-priority-fee opt-out — does not fire.) See: github.com/Copenhagen0x/solana-security-standard#sol-030.'
    patterns:
      - pattern-regex: microLamports\s*:\s*(?:0[xX][0-9a-fA-F]+|[1-9][0-9_]*)
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/mocks/**'
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/node_modules/**'
        - '**/dist/**'
        - '**/build/**'
    metadata:
      sol-id: SOL-030
      category: security
      confidence: LOW
      technology:
        - solana
        - typescript
        - javascript
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-030
      license: MIT
      sss-tier: low
      sss-severity: low
      sss-exclusions:
        - the priority fee is derived from getRecentPrioritizationFees() / a fee oracle and clamped to a sane max
        - 'microLamports: 0 (the intentional no-priority opt-out) or a documented test/config default'
  - id: solana-security-standard.sol-031-jupiter-quote-freshness
    languages:
      - typescript
      - javascript
    severity: WARNING
    message: 'Jelleo SOL-031: Jupiter quote consumed without a `contextSlot` freshness check. Quotes go stale within a few slots; executing an old route means a worse fill and MEV/sandwich exposure. Capture `quoteResponse.contextSlot` and refetch (or reject) if it lags the current slot before you swap. Heuristic flag — fires on Jupiter quote usage (any `api.jup.ag` host or the `@jup-ag/api` client); ignore if you already gate on `contextSlot`. See: github.com/Copenhagen0x/solana-security-standard#sol-031.'
    patterns:
      - pattern-regex: (?:api\.jup\.ag|createJupiterApiClient)
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/mocks/**'
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/node_modules/**'
        - '**/dist/**'
        - '**/build/**'
    metadata:
      sol-id: SOL-031
      category: security
      confidence: LOW
      technology:
        - solana
        - typescript
        - javascript
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-031
      license: MIT
      sss-tier: high
      sss-severity: medium
      sss-exclusions:
        - quoteResponse.contextSlot is captured and the route is refetched/rejected when it lags the current slot
        - the quote is consumed within the same slot as the fetch (an undefined 'freshness window' is not sufficient — prefer ex1's explicit contextSlot check) AND a slippage bound protects the fill
  - id: solana-security-standard.sol-038-pda-seed-collision
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-038: two caller-controlled variable-length seeds (`x.as_bytes(), y.as_bytes()`) sit ADJACENT in `seeds = [...]` with no fixed-width separator. Seeds hash as one flat buffer, so the boundary is unpinned: `a|bX == ab|X` derives the SAME PDA for two DISTINCT accounts (alias/overwrite). Fix: pin every boundary - hash/length-prefix each variable element to a constant width, OR keep one variable element LAST, OR put a fixed-width element (Pubkey/`[u8; N]`) between two variables; AND lead same-namespace schemes with a per-type tag of a CONSISTENT width (all u32, never mixed) from one program-wide enum. Fires on two adjacent `.as_bytes()` seeds in the `seeds = [...]` macro and the native `find_program_address(&[...])` form; misses the cross-scheme and `.as_ref()`-on-slice forms (see exclusions). Distinct from SOL-008/016. See: github.com/Copenhagen0x/solana-security-standard#sol-038.'
    patterns:
      - pattern-regex: (?:\bseeds\s*=\s*\[|\b(?:find|create)_program_address\s*\(\s*&\[)[^\]]{0,160}?\.as_bytes\(\)\s*,\s*&?\s*[A-Za-z_][\w.]{0,60}\.as_bytes\(\)
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-038
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-038
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - 'The seed array has at most ONE variable-length element and it is the LAST element, every element before it is fixed-width (a fixed-length namespace literal like b"vault", a Pubkey''s 32 bytes, a u8/u64::to_le_bytes(), or a [u8; N]) — AND one of the following holds so cross-scheme aliasing is also excluded: (a) this is the program''s ONLY PDA scheme that ends in a variable-length element, OR (b) every same-namespace scheme that ends in a variable element carries a fixed-width leading per-type discriminator drawn from one program-wide registry (see exclusion 4), OR (c) all sibling schemes'' fixed prefixes are provably equal-length. A single trailing variable prevents only INTRA-scheme byte-shifting; it does NOT prevent two trailing-variable schemes with unequal-length fixed prefixes from aliasing — e.g. [b"a", name] and [b"ab", name2] collide on a|bX == ab|X. Without (a), (b), or (c), do NOT suppress.'
        - Every variable-length element is normalized to a FIXED width before being placed in the seeds — hashed to 32 bytes (e.g. hash(name).to_bytes() / keccak), length-prefixed with its own byte count, or truncated/padded to a constant [u8; N] — so element boundaries are unambiguous regardless of content. (Width-fixing alone clears the intra-scheme shift; if more than one record type shares this layout it must ALSO carry the exclusion-4 discriminator, since equal-width-but-untagged schemes still cross-alias.)
        - The seed material is entirely fixed-width or program-controlled (only Pubkeys, fixed integer encodings, enum discriminants, or hardcoded equal-length literals) with NO caller-supplied variable-length bytes, so an attacker cannot shift any boundary or pick a colliding value.
        - 'Every same-namespace scheme leads with a fixed-width per-type discriminator (seed[0]) drawn from a SINGLE program-wide enum/registry whose variants are guaranteed distinct AND a CONSISTENT fixed width across the registry (e.g. #[repr(u32)] enum PdaTag { ... } used as PdaTag::X as u32, never a 1-byte tag that could equal a literal seed prefix and never mixed widths since a narrower tag can prefix a wider one) AND no remaining element can byte-shift against the next (each is fixed-width or the variable element is last and width-fixed per exclusion 2). A discriminator that is a free-floating per-file const with no registry does NOT qualify — nothing prevents two account types from sharing the same value and re-colliding.'
        - A fixed-width element (a 32-byte Pubkey via key().as_ref(), a [u8; N], a fixed integer encoding, or a hashed/length-prefixed element) placed BETWEEN two variable-length seeds pins both boundaries independently -- no byte can shift across a fixed separator (matching it would require the variable bytes to reproduce the exact fixed value at a shifted offset, infeasible for a non-degenerate value) -- so two variable seeds separated by a Pubkey or other fixed-width element are SAFE. The regex correctly does not fire on this (only directly-adjacent .as_bytes(), .as_bytes() triggers it); a reviewer applying exclusion 1 should likewise treat any two variables separated by a fixed-width element as cleared.
  - id: solana-security-standard.sol-039-partial-cpi-state
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-039: a fund-moving CPI''s Result is SWALLOWED (`let _ = ...`, `.ok()`, a logged `.is_err()`/`.is_ok()`, `.unwrap_or*`, or a `match`/`if let Err =` arm that does not re-`?`). On Solana only an Err RETURNED from the top-level instruction reverts writes, so a caught inner-CPI failure leaves any account written BEFORE the call committed while the transfer never happened - an asymmetric half-applied state the attacker farms by forcing the CPI to fail. Propagate with `?` so the instruction reverts atomically; if you must catch it, ROLL BACK every prior self-mutation. The regex sees the discarded Result but not whether a self-mutation preceded it: dismiss via exclusion #4 (nothing committed first), #2 (`?`-propagated), #3 (`require!`-guarded `.is_ok()`), #5 (rollback). It DOES fire on `require!(cpi.is_ok())` and a `match` whose `Err` arm returns - both SAFE. Distinct from SOL-033. See: github.com/Copenhagen0x/solana-security-standard#sol-039.'
    patterns:
      - pattern-regex: (?:\blet\s+_\s*=\s*(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\s*\(|(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\s*\([^;]{0,1200}?\)\s*\.\s*(?:ok|is_err|is_ok|unwrap_or|unwrap_or_default|unwrap_or_else)\s*\(|\bif\s+let\s+(?:Ok|Err)\s*\([^)]*\)\s*=\s*(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\s*\(|\bmatch\s+(?:invoke(?:_signed)?|token::(?:transfer|transfer_checked|burn|mint_to|close_account|thaw_account|freeze_account|approve|revoke))\s*\()
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-039
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-039
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - 'The swallowed call is not a fund-moving CPI — a local helper, msg!, or checked-arith Result with no external/cross-account effect. Confirm the discarded Result belongs to an invoke/invoke_signed or token:: CPI, not an unrelated value.'
        - The CPI is actually `?`-propagated or `.map_err(..)?`'d — the instruction reverts on failure, so there is no asymmetry. (The regex does not fire on a bare `?`/`.map_err(..)?` call; cite this only if a reviewer mis-reads a propagated call.) This also covers a `match`/`if let Err(e) =` whose arm `return Err(e)`s or `?`-propagates - the instruction still reverts, so there is no asymmetry even though the regex fires on the `match`/`if let` head.
        - 'The discarded Result feeds a `require!` / `assert!` / `ensure!` (e.g. `require!(token::transfer(..).is_ok(), E)`): this RETURNS Err on failure and reverts the whole instruction, so it is SAFE. The regex FIRES on every `require!`/`assert!`/`ensure!`-guarded `.is_ok()` (it is lookbehind-free / RE2-compatible) - cite this exclusion to dismiss them; they are safe because the macro returns Err on failure and reverts the instruction.'
        - The catch branch (`.ok()` consequence, the `Err(..)` match arm, the `if let Err` body) FULLY rolls back every prior self-mutation before returning — re-credits the debt, un-burns the shares, restores the nonce — so committed state stays symmetric on failure.
        - 'No program-owned account is written before AND the swallow leaves no attacker-controllable asymmetry — i.e. the CPI is the handler''s only state change, OR the only prior writes are idempotent set-to-constant values that a replay/retry re-derives identically (nothing the attacker can farm by forcing the CPI to fail). NOTE: cite this even when an UNRELATED write follows the CPI later in the handler — the gate is ''was a dependent self-mutation committed before the swallow that a failed CPI would orphan'', not ''is the CPI the literal last statement''.'
  - id: solana-security-standard.sol-042-compute-budget-dos
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-042: a loop iterates `remaining_accounts`, whose length the caller controls. With no per-instruction cap, an attacker pads it until the handler exceeds the ~1.4M CU limit and EVERY call reverts - a permanent DoS that freezes any crank behind it. Bound the trip count: `require!(ctx.remaining_accounts.len() <= MAX, ...)` (MAX proven to fit the CU budget), a fixed slice, or paginate with a stored cursor; also cap any persisted Vec the loop reads at its push site (even an admin-grown list bricks it). DO NOT stop at the count: if the loop pays accounts, bind each iterated account by identity to authoritative state (`require_keys_eq!` vs a stored registry/PDA) or it is a double-pay/skip fund-drain (SOL-027). Fires on `for <x> in ...remaining_accounts...` incl. `for (i, acc) in ...enumerate()`; misses `while i < len()` and `.iter().for_each/map/fold`. Distinct from SOL-027, SOL-014. See: github.com/Copenhagen0x/solana-security-standard#sol-042.'
    patterns:
      - pattern-regex: \bfor\s+(?:\w+|\([^)]{0,80}\))\s+in\b[^{;]{0,80}\bremaining_accounts\b
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-042
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-042
      license: MIT
      sss-tier: high
      sss-severity: medium
      sss-exclusions:
        - 'the iteration is bounded by an enforced per-instruction cap BEFORE the loop (require!(list.len() <= MAX) / a fixed-size slice / .take(MAX) over a *validated* length / a `[T; N]` array) where MAX is a constant proven to fit the CU budget for this loop body — NOT an unverified ''it''s usually small'' assumption. HUMAN-VERIFY (RE2 cannot see this): the cap must not be a `.take()`/truncating slice that silently DROPS unprocessed entries when correctness requires all of them (e.g. a settlement/payout set) — that is a correctness bug masquerading as a fix; paginate instead. A truncating cap only qualifies when dropping the tail is provably correct for this handler.'
        - 'the collection is append-only or growable but its GROWTH path is itself capped so it can never exceed the executable CU bound — a bounded `Vec`/`require!` at *every* push/realloc site, with the cited push site actually shown to be bounded. HUMAN-VERIFY (machine cannot prove a negative across the codebase): ''growth is probably bounded somewhere'' is NOT a dismissal — name the file+line of the push site and show the cap there. A cap on the read/loop while the stored list can still grow unbounded does NOT qualify (a near-max list plus one more entry can still tip a *different* reader over).'
        - 'the loop length is fixed by program state that can NEVER exceed the executable CU bound — a compile-time constant, a `[T; N]` array, or a count derived from validated PDAs the program itself created under a bounded scheme. NOTE: ''only an admin/Signer can grow it'' does NOT by itself qualify — an admin (or a compromised/buggy admin path) that grows an append-only list past the CU bound bricks the instruction for everyone; the test is ''length is bounded by a CU-provable cap'', not ''an attacker can''t influence the length''. Prove the bound by tracing every write site, not ''this list looks internal''.'
        - work is explicitly paginated / chunked across transactions with a persisted cursor (or an offset+limit argument) so no single instruction processes more than a bounded slice, the cursor cannot be reset to replay or skip work, AND — when the loop credits/pays/settles accounts — each iterated account is bound by identity to authoritative program state at the cursor offset (require_keys_eq! against a stored registry/PDA per index), so the cursor SELECTS recipients rather than merely counting iterations. A count cap + bare cursor that pays whatever the caller passes does NOT qualify — that is a double-pay/skip fund-drain (SOL-027), strictly worse than the DoS, and is NOT excluded by this rule.
  - id: solana-security-standard.sol-044-hardcoded-slot-time-rate
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-044: a hardcoded slot->time conversion (SLOTS_PER_YEAR/DAY/..., MS_PER_SLOT, or a slot delta `* / 400`) computes elapsed time. Solana slot time is NOT a fixed ~400ms - it drifts with load (historically slower) - so interest/emissions/vesting/funding accrued this way diverges from wall-clock (over/under-payment that compounds; an attacker farms the drift). Fix: accrue on `Clock::get()?.unix_timestamp` deltas (store `last_update_ts: i64`; use `now_ts - last_update_ts`), never a slots-per-period constant. If you clamp the delta, advance the cursor by only the charged amount (`last_update_ts += elapsed`) - a `.min(MAX)` then `last_update_ts = now` silently forgives time beyond MAX (deterministic interest evasion). Dismiss via exclusion #1 (logs/UI only), #2 (not a slot->time scale), #3 (per-slot by spec), #4 (conservative bound that can only REJECT). Distinct from SOL-001. See: github.com/Copenhagen0x/solana-security-standard#sol-044.'
    patterns:
      - pattern-regex: \bSLOTS_PER_(?:YEAR|DAY|HOUR|MINUTE|WEEK|MONTH|EPOCH|SECOND)\b|\b(?:MS_PER_SLOT|SLOT_DURATION_MS|SLOT_TIME_MS|MILLIS_PER_SLOT)\b|\bslots?\b[^;\n]{0,40}?[*/]\s*400\b
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-044
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-044
      license: MIT
      sss-tier: high
      sss-severity: medium
      sss-exclusions:
        - the elapsed time driving the accrual is computed from Clock::get()?.unix_timestamp deltas (e.g. now_ts - last_update_ts on stored i64 timestamps), and the slots-per-period / ms-per-slot constant is used only for a non-economic, non-priority purpose such as log formatting or a UI hint that never scales a payout and never decides ordering/fill/liquidation/seniority — naming which it is
        - the hardcoded constant is NOT a slot→time conversion at all — name what it actually is (a compute-unit budget, a bps/percentage denominator, a fixed-point Q-scale, a seeds/byte-length constant, or a per-slot reward that is intentionally denominated in slots by spec with the slot-denomination cited) — so no wall-clock assumption is embedded
        - 'the protocol is provably slot-denominated by design: cite the spec clause that defines the rate per SLOT rather than per unit of real time, AND trace every consumer of the slot-accrued field to confirm none compares, sums, or mixes it with a unix_timestamp-derived value (any such mix reintroduces the drift; this is an explicit trace of all readers, not a glance)'
        - the slot delta is converted to time only to form an UPPER/LOWER bound in a conservative safety check, AND the citer states (a) the comparison sign and (b) the worst-case drift direction (slots historically run SLOWER than 400ms → the same slot delta spans MORE wall-clock), and shows that under that drift the check can only ever REJECT more than wall-clock would (stricter), never ACCEPT more value than real time allows — a max-staleness gate `now_slot - last_slot < MAX` is NOT covered, because slow slots make it accept quotes that are actually staler than intended
  - id: solana-security-standard.sol-046-hand-rolled-dispatch
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-046: a hand-rolled instruction dispatcher (`match instruction_data[0]` / split-first tag byte) routes by raw bytes instead of Anchor''s `#[program]` macro. This BYPASSES the framework: no 8-byte discriminator check and NONE of the `#[account(...)]` constraints (has_one, seeds/bump, owner, signer, mut) run - they are only emitted for `#[derive(Accounts)]` handlers. The pattern flags the DISPATCHER; the bug lives in the ROUTED handler - if it takes a bare `&[AccountInfo]`, every account is unvalidated (wrong-type/owner, unsigned, PDA-substituted). Routing only to typed `Context<T>` handlers is safe. Fix: route through `#[program]` + `#[derive(Accounts)]`, OR (if native) re-validate EVERY account on EVERY arm - `try_deserialize` (discriminator), `owner == program_id`, canonical-vs-stored bump (SOL-016), `is_signer`. FP: also fires on `match <local>[0]` over validated program-owned data. See: github.com/Copenhagen0x/solana-security-standard#sol-046.'
    patterns:
      - pattern-regex: match\s+(?:instruction_data|_?ix_?data|data|input)\s*(?:\.\s*(?:first|split_first|get)\s*\([^)]{0,40}\)|\[\s*0\s*\])
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-046
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-046
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the dispatched handler is an Anchor `#[derive(Accounts)]` context (the accounts arrive as a typed `Context<T>` whose struct carries the relevant `Account<'info,_>` / `Signer<>` / `has_one` / `seeds`+`bump` / `owner` constraints) — i.e. the hand-rolled `match` only selects an Anchor handler and does NOT itself consume a raw `&[AccountInfo]`; Anchor's generated guards still run
        - 'this IS a deliberate native (non-Anchor) program AND every account on the matched arm is manually re-validated before use — a positive ''all four guards present on THIS arm'' proof, not ''the program looks careful'': (a) the 8-byte discriminator is verified via `try_deserialize` (NOT `try_deserialize_unchecked`) or an explicit constant-tag compare; (b) `owner == program_id` (or the expected program) is asserted on each account whose data is trusted; (c) each claimed PDA is re-derived via `find_program_address` and the returned CANONICAL bump is compared against the account''s STORED bump (SOL-016) — re-derivation via `create_program_address` with a CALLER-SUPPLIED bump does NOT count, because it accepts any valid off-curve bump and re-introduces the non-canonical-bump bug; and (d) `is_signer` is checked on every privileged/authority account'
        - the byte-match is not an instruction dispatcher at all — it is a bounded enum/version-tag parse on already-program-owned, discriminator-validated data (e.g. matching a state-machine status byte read out of an `Account<'info,T>` whose owner and discriminator Anchor already checked), so no account validation is being skipped
        - 'the matched first byte selects only among handlers that take ZERO accounts (pure compute / read-only view that returns data WITHOUT reading, writing, moving lamports from, or CPI-ing through any passed account) — so there is no account whose owner/signer/PDA/discriminator could be forged. NOTE: a ''view'' that READS even one passed account is NOT covered — it must still validate that account''s owner and discriminator before trusting the data it returns'
  - id: solana-security-standard.sol-049-struct-padding-flag
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-049: a HAND-WRITTEN `unsafe impl Pod`/`Zeroable for ...` on account-data. The real `#[derive(Pod, Zeroable)]` rejects a `bool` or implicit padding at compile time; a hand impl silently asserts Pod, so a security-relevant byte (a bool flag or reserved padding) is read with NO canonicalization - a `bool` reads `true` for ANY non-zero byte, and if attacker-writable that opens an authority gate. Distinct from SOL-017, SOL-007. Fix (ALL required): drop the hand impl - use `#[account(zero_copy)]` + `AccountLoader::load()` or the REAL derive, over a layout with NO bool and NO implicit padding (named fields; reserved bytes zero-checked on load AND zeroed on write); store flags as `u8`, assert canonicality on EVERY load (`require!(flag <= 1)`, branch `== 1`); AND validate the OWNER + 8-byte discriminator (canonicalization alone is bypassable). Fires only on a single-line hand `unsafe impl ... for`; raw `bytemuck` casts are review-only. See: github.com/Copenhagen0x/solana-security-standard#sol-049.'
    patterns:
      - pattern-regex: unsafe\s+impl\b[^;{\n]{0,80}\b(?:Pod|Zeroable)\s+for\b
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-049
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-049
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the flag is a u8 (not a bool) AND every read path asserts canonicality before use — require!(flag <= 1) (or a match that rejects all bytes except the enumerated valid ones) runs on EVERY load, not only at init — AND the branch tests an exact value (flag == 1), never flag != 0
        - 'the struct uses Anchor''s #[account(zero_copy)] (or derives bytemuck::Pod/Zeroable via the real derive macro — NOT a hand-written `unsafe impl Pod`) on a layout with NO bool fields and NO implicit padding: every byte is a named field, reserved/padding fields included, and those reserved bytes are zero-checked on load — so there is no type-system-skipped byte for an attacker to set and no UB-bool path'
        - 'no padding/reserved byte and no aliased/union field is ever observable: the reinterpreted value is used field-by-field only, and no whole-struct bytes are hashed, equality-compared, serialized, or re-borrowed through an overlapping view (this disqualifies the hand-impl-Pod padding-leak trap that survives a clean u8 flag)'
        - 'the account holding the buffer is provably never attacker-writable for this byte: it is program-owned and only ever written by handlers gated to a signer bound by constraint to a hardcoded/program-stored admin key (a bare Signer<> the caller self-assigns is NOT sufficient), and the buffer is not a caller-supplied AccountInfo reinterpreted with this layout (that is the SOL-017/SOL-007 trap)'
        - the value is provably discarded — never used in an authority/state gate, written back, hashed, or emitted (a positive 'not security-relevant' proof, not merely 'this handler does not seem to use it')
  - id: solana-security-standard.sol-051-predictable-onchain-entropy
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-051: an on-chain-observable value (Clock unix_timestamp/slot, RecentBlockhashes/SlotHashes sysvar) seeds a draw. HIGH-FP arms: `unix_timestamp %` and `slot % len` fire on legitimate time-bucketing/cooldown windows and round-robin indexing - DISMISS (exclusion #4) unless a payout/mint/rank decision READS the modulo result. Real bug: these values are NOT random - every node computes the same one, so the submitter simulates and only sends when they win (grind), and the slot leader can steer them. If it seeds a value-bearing outcome (lottery/raffle/airdrop) it is deterministically claimable -> drain; hashing/XOR-mixing does NOT help. Fix needs ALL: a VRF (Switchboard/ORAO) or commit-reveal; an OWNER check that the result account is the oracle program''s (a program-local struct is forgeable); binding to THIS draw via a key stored at request time; the oracle reveal method that fails when unfulfilled; a commit-slot freshness check. See: github.com/Copenhagen0x/solana-security-standard#sol-051.'
    patterns:
      - pattern-regex: \brecent_blockhashes\b|\bRecentBlockhashes\b|\bslot_hashes\b|\bSlotHashes\b|\bunix_timestamp\b[\s\S]{0,80}?%|\bslot\b[\s\S]{0,40}?%[\s\S]{0,40}?\blen\b
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-051
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-standard#sol-051
      license: MIT
      sss-tier: high
      sss-severity: high
      sss-exclusions:
        - the randomness comes from a VRF whose ORACLE-OWNED result account is verified before use — you assert `*acct.owner == <switchboard/orao program id>` (or use the oracle's typed wrapper that enforces it) AND parse it with the oracle's type (e.g. Switchboard `RandomnessAccountData::parse`), AND that result account is bound to THIS specific draw by a key recorded at request/commit time (`has_one`, or comparison against a `Pubkey` stored in your state) — a VRF whose result account is read but never owner-checked, OR bound only via a `seeds=[…, pool.key()]` PDA re-derived under YOUR program id (which can never point at a genuine oracle account and is itself attacker-writable), is NOT sufficient
        - the value is read through the oracle's reveal method that FAILS when the round is not yet fulfilled (e.g. `RandomnessAccountData::get_value(clock.slot)` returning `RandomnessNotResolved`) and a zeroed/unrevealed buffer is rejected — a self-set `fulfilled`/`settled` bool on a program-local account, or reading the buffer before fulfillment, does NOT qualify, AND the request is fresh (the committed `seed_slot`/commit slot is checked so a stale or expired round cannot be replayed)
        - the draw uses a commit–reveal where the committed value is stored on-chain BEFORE the seed material becomes knowable and the reveal is checked against the commitment (hash preimage) — a 'commit' that commits to a value the committer can still grind at reveal time does NOT qualify
        - the timestamp/slot feeds time-bucketing, a cooldown or rate-limit window, or expiry math (`now % period`, `slot % epoch_len` as an epoch/round index), NOT a value-bearing draw outcome — proven by tracing that no payout, mint, rank, or fund-routing decision reads the modulo result (this is the single most common legitimate use of `unix_timestamp %` / `slot % len` and is the primary false-positive class on the timestamp/slot regex arms)
        - the on-chain value (timestamp/slot/blockhash/key) feeds a NON-value-bearing, non-adversarial use only — a UI tiebreaker, a non-prize display shuffle, or jitter on a value no party profits from steering — proven by tracing that no payout, mint, rank, or fund-routing decision reads the result (a positive 'no value rides on this draw' proof, not 'looks cosmetic')
        - the value is used as a uniqueness/nonce or PDA seed, NOT as the random outcome itself (predictability is fine for a nonce; the draw result must not be a function of it)
