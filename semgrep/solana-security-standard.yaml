# Solana Security Standard — Semgrep ruleset (SOL-0XX).
# GENERATED from ../security-patterns.yaml by cli/scripts/sync-semgrep.js — do not edit by hand.
# Regenerate: `npm --prefix cli run sync:semgrep`.
# Run:        `semgrep --config semgrep/solana-security-standard.yaml <path>`.
rules:
  - id: solana-security-standard.sol-001-unauth-now-slot
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-001: handler accepts `now_slot` from instruction data. Authenticate against Clock::get()?.slot before use — caller-controlled clocks enable permanent DoS of permissionless cranks. Two confirmed-exploitable bounty wins in this class: percolator-prog#107 (ACTIVATE, fixed 6512fa1) + percolator-cli#78 F33 (RETIRE, fixed 3fd9b1d). See: github.com/Copenhagen0x/solana-security-guidance#sol-001.'
    patterns:
      - pattern-regex: fn\s+\w+(?:<[^>]{0,120}>)?\([^)]{0,500}now_slot\s*:\s*u64
    paths:
      exclude:
        - '**/tests/**'
        - '**/test/**'
    metadata:
      sol-id: SOL-001
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-001
      license: MIT
  - id: solana-security-standard.sol-002-cross-market-counter
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-002: cross-market aggregate counter. Verify EVERY write to this field is gated by per-market authorization — permissionless cross-market inflation enables insurance-fund drain. Documented public class (percolator-prog#104); not a Jelleo bounty win — included because the pattern is reproducible across perp-DEX programs. See: github.com/Copenhagen0x/solana-security-guidance#sol-002.'
    patterns:
      - pattern-regex: pnl_pos_bound_tot|cross_market_counter|insurance_fund_total|shared_pool_total
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-002
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-002
      license: MIT
  - id: solana-security-standard.sol-005-realloc-no-guard
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-005: AccountInfo.realloc() called. Verify (1) account owner == program_id, (2) new size is bounded, (3) rent-exemption maintained after resize. Latent pattern documented in our bounty 5 disclosure (percolator-cli#78 F12) — reachable when the per-program asset cap is lifted. See: github.com/Copenhagen0x/solana-security-guidance#sol-005.'
    patterns:
      - pattern-regex: \.realloc\(
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-005
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-005
      license: MIT
  - id: solana-security-standard.sol-006-raw-account-info
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-006: raw `AccountInfo` (no Signer<>/Account<> type). If this account is a privileged CALLER, verify `account.is_signer == true` before mutating state, or use Anchor''s `Signer<>`. (A documented `/// CHECK:` account used only as a CPI target / program ID / read-only ref is fine — this is a heuristic flag.) See: github.com/Copenhagen0x/solana-security-guidance#sol-006.'
    patterns:
      - pattern-regex: \bAccountInfo\s*<
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-006
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-006
      license: MIT
  - id: solana-security-standard.sol-007-raw-data-borrow
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-007: raw `&*account.data.borrow()` access. Verify `account.owner == program_id` BEFORE deserializing — attacker can pass a same-length account from a different program whose layout matches. See: github.com/Copenhagen0x/solana-security-guidance#sol-007.'
    patterns:
      - pattern-regex: '&\*\w+\.data\.borrow\(\)'
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-007
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-007
      license: MIT
  - id: solana-security-standard.sol-009-invoke-signed
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-009: `invoke_signed` CPI. Verify the CALLER has authority for this operation BEFORE the CPI — `invoke_signed` just signs with a PDA, it doesn''t validate upstream authority. See: github.com/Copenhagen0x/solana-security-guidance#sol-009.'
    patterns:
      - pattern-regex: invoke_signed\s*\(
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-009
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-009
      license: MIT
  - id: solana-security-standard.sol-010-init-if-needed
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-010: init_if_needed enables reinit attacks. If the account holds value or grants authority, a second call can drop balances. Use plain `init` with explicit existence checks unless reinit is truly required. See: github.com/Copenhagen0x/solana-security-guidance#sol-010.'
    patterns:
      - pattern-regex: init_if_needed
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-010
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-010
      license: MIT
  - id: solana-security-standard.sol-011-close-attr
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-011: `#[account(close = ...)]`. Verify (1) account is fully drained before close, (2) lamports go to a controlled destination, (3) any token accounts are closed via Token program, not just zeroed. See: github.com/Copenhagen0x/solana-security-guidance#sol-011.'
    patterns:
      - pattern-regex: '#\[account\([^;{}#]{0,400}?close\s*='
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-011
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-011
      license: MIT
      note: 'RE2-safe port: the scanner''s depth-2 paren-balanced regex is rejected by Semgrep as "too large" (RE2 expands the nested {0,N} repetitions). This delimiter-bounded window flags `close =` within a 400-char #[account( ... ) region. It stops the window at ; { } and # — none appear inside an attribute, and stopping at # means the NEAREST #[account( wins so the finding lands on the right attribute even when two are adjacent. It favors recall over the scanner''s exact paren-balancing; both flag the same real #[account(close = ...)] attributes incl. long multi-line ones. Known limit: a raw-string literal (r#"..."#) inside a constraint before close= would stop the window early — a theoretical Semgrep-only miss; the scanner still catches it.'
  - id: solana-security-standard.sol-013-hardcoded-token-program
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-013: hardcoded SPL Token program ID. Use `anchor_spl::token::ID` (or `anchor_spl::token_2022::ID` for Token-2022 accounts) so the typed account ensures the right program is invoked. See: github.com/Copenhagen0x/solana-security-guidance#sol-013.'
    patterns:
      - pattern-regex: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    metadata:
      sol-id: SOL-013
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-013
      license: MIT
  - id: solana-security-standard.sol-014-unchecked-arithmetic
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-014: integer +/-/* without checked_*. Release builds wrap silently — overflow OR subtraction underflow (the classic lamport drain) — and the wrap is the financial bug. Use `a.checked_add(b)` / `checked_sub(b).ok_or(ErrorCode::Overflow)?`. Heuristic flag — already-checked code can ignore. See: github.com/Copenhagen0x/solana-security-guidance#sol-014.'
    patterns:
      - pattern-regex: (?:u64|i64|u128|i128)\s*=\s*\w+\s*[-+*]\s*\w+\s*[;,)]
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-014
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-014
      license: MIT
  - id: solana-security-standard.sol-016-bump-field-read
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-016: reading a stored `.bump` field. Verify the bump matches `Pubkey::find_program_address(seeds, &program_id).1` (canonical bump) on the FIRST read — subsequent reads of the same bump are OK. Without this, an attacker can pre-create a PDA with a non-canonical bump. See: github.com/Copenhagen0x/solana-security-guidance#sol-016.'
    patterns:
      - pattern-regex: \.bump\s*[;,)}\]]
    paths:
      exclude:
        - '**/tests/**'
        - '**/state*.rs'
        - '**/state/**'
    metadata:
      sol-id: SOL-016
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-016
      license: MIT
  - id: solana-security-standard.sol-017-unsafe-transmute
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-017: `unsafe transmute` on account data. Use bytemuck/anchor typed deserialize with explicit length + discriminator checks. transmute skips both. See: github.com/Copenhagen0x/solana-security-guidance#sol-017.'
    patterns:
      - pattern-regex: (?:unsafe \{ transmute|unsafe\{transmute)
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-017
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-017
      license: MIT
  - id: solana-security-standard.sol-018-hardcoded-system-program
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-018: hardcoded System Program ID literal (32 ones in quotes — the canonical empty pubkey). Use `solana_program::system_program::ID` so the comparison is type-safe and a future renaming/typo doesn''t silently break verification. See: github.com/Copenhagen0x/solana-security-guidance#sol-018.'
    patterns:
      - pattern-regex: '"11111111111111111111111111111111"'
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-018
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-018
      license: MIT
  - id: solana-security-standard.sol-019-try-deserialize-unchecked
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-019: `try_deserialize_unchecked` skips the 8-byte discriminator check. An attacker can pass a different account type with matching length. Use `try_deserialize` (with discriminator check) unless you''ve already verified the discriminator manually. See: github.com/Copenhagen0x/solana-security-guidance#sol-019.'
    patterns:
      - pattern-regex: try_deserialize_unchecked
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-019
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-019
      license: MIT
  - id: solana-security-standard.sol-020-set-authority
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-020: SetAuthority CPI. Verify the CURRENT authority matches the expected key BEFORE invoking — without this check, an attacker can hijack ownership of any token account that flows through this handler. See: github.com/Copenhagen0x/solana-security-guidance#sol-020.'
    patterns:
      - pattern-regex: \b(SetAuthority\b|set_authority\s*\()
    paths:
      exclude:
        - '**/tests/**'
    metadata:
      sol-id: SOL-020
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-020
      license: MIT
  - id: solana-security-standard.sol-024-oracle-price-unchecked
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-024: `get_price_unchecked` reads a Pyth price with NO staleness or confidence check. Use `get_price_no_older_than(...)` and reject prices whose confidence interval is too wide — a stale or wide-confidence price lets an attacker trade/liquidate at a mispriced value. See: github.com/Copenhagen0x/solana-security-guidance#sol-024.'
    patterns:
      - pattern-regex: get_price_unchecked
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
      sol-id: SOL-024
      category: security
      confidence: LOW
      technology:
        - solana
        - anchor
      references:
        - https://github.com/Copenhagen0x/solana-security-guidance#sol-024
      license: MIT
  - id: solana-security-standard.sol-025-sysvar-raw-deserialize
    languages:
      - rust
    severity: WARNING
    message: 'Jelleo SOL-025: a sysvar (Clock/Rent) read by RAW-deserializing account data instead of `Clock::get()` or `Sysvar::from_account_info` (both of which key-check the account internally). The raw path trusts whatever account is passed, so an attacker supplies a look-alike carrying chosen time/rent values. Fix: use `Clock::get()` / Anchor `Sysvar<>`; never hand-deserialize a sysvar account. See: github.com/Copenhagen0x/solana-security-guidance#sol-025.'
    patterns:
      - pattern-regex: (?:bincode::deserialize::<Clock|bincode::deserialize::<Rent)
    paths:
      exclude:
        - '**/tests/**'
        - '**/client/**'
        - '**/cli/**'
        - '**/offchain/**'
        - '**/sdk/**'
    metadata:
